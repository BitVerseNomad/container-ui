<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenPier: three visual directions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Three directions for the same screen and the same data.
   Open with #dir=a|b|c&theme=light|dark&bare=1 */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: default; }
.num { font-variant-numeric: tabular-nums; }
#bar { position: fixed; right: 12px; bottom: 12px; z-index: 9; display: flex; gap: 6px; }
#bar button { padding: 4px 10px; border-radius: 6px; border: 1px solid #8884; background: #fff; color: #111; }
body.bare #bar { display: none; }
#root { height: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============ A. Manifest: cool, native, dense. Signature: every service is a block on the quay ============ */
.A { --bg:#F7F8FA; --side:#EDEFF3; --ink:#14181F; --mute:#5B6472; --faint:#98A1AE; --line:#DDE1E7; --row:#FFFFFF; --accent:#1F4FD8; --ok:#1E8E5A; --warn:#B7791F; --bad:#D0342C; --off:#C3C9D2; --badfill:#FCEEEC; --btn:#FFFFFF;
  height:100%; display:flex; background:var(--bg); color:var(--ink); }
.A.dark { --bg:#15181D; --side:#101216; --ink:#E6E9EE; --mute:#8A93A1; --faint:#5F6875; --line:#262B33; --row:#1B1F26; --accent:#7C9DFF; --ok:#3CCB86; --warn:#E5A93B; --bad:#FF6B61; --off:#3A414C; --badfill:#2B1A1A; --btn:#232831; }
.A aside { width:208px; background:var(--side); border-right:1px solid var(--line); padding:44px 8px 8px; display:flex; flex-direction:column; gap:2px; }
.A .eng { display:flex; align-items:center; gap:8px; padding:6px 8px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:var(--row); }
.A .eng small { display:block; color:var(--mute); font-size:11px; }
.A .nav { display:flex; align-items:center; gap:8px; height:28px; padding:0 8px; border-radius:6px; color:var(--mute); }
.A .nav[aria-current] { background:var(--accent); color:#fff; font-weight:500; }
.A .nav b { margin-left:auto; font-weight:400; font-size:11px; opacity:.8; }
.A .nav .alert { color:#fff; background:var(--bad); border-radius:9px; padding:0 6px; opacity:1; }
.A main { flex:1; min-width:0; display:flex; flex-direction:column; }
.A header { height:52px; display:flex; align-items:center; gap:12px; padding:0 20px; border-bottom:1px solid var(--line); }
.A h1 { font-size:15px; margin:0; font-weight:600; }
.A .meters { margin-left:auto; display:flex; gap:18px; color:var(--mute); font-size:11px; }
.A .meter { display:flex; align-items:center; gap:6px; }
.A .meter i { display:block; width:64px; height:4px; border-radius:2px; background:var(--line); position:relative; overflow:hidden; }
.A .meter i::after { content:""; position:absolute; inset:0; width:var(--v); background:var(--ink); border-radius:2px; }
.A .meter.hot i::after { background:var(--warn); }
.A .btn { height:26px; padding:0 10px; border-radius:6px; border:1px solid var(--line); background:var(--btn); box-shadow:0 1px 0 #0000000a; white-space:nowrap; }
.A .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
.A .tbl { padding:0 20px 20px; overflow:auto; }
.A .tr { display:grid; grid-template-columns: 22px 190px 150px 1fr 96px 86px 124px 70px; align-items:center; gap:0 12px; min-height:34px; padding:0 8px; border-bottom:1px solid var(--line); }
.A .th { color:var(--faint); font-size:11px; min-height:30px; position:sticky; top:0; background:var(--bg); }
.A .tr.kid { background:var(--row); min-height:30px; }
.A .tr.kid .nm { padding-left:14px; color:var(--mute); }
.A .tr.why { grid-template-columns: 22px 1fr auto; background:var(--badfill); min-height:32px; border-bottom-color:transparent; }
.A .tr.why span { padding-left:14px; }
.A .tr.why em { font-style:normal; color:var(--bad); font-weight:600; }
.A .nm { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.A .sub { color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.A .blocks { display:flex; gap:3px; }
.A .blocks u { width:14px; height:14px; border-radius:3px; background:var(--ok); text-decoration:none; }
.A .blocks u.warn { background:var(--warn); } .A .blocks u.bad { background:var(--bad); } .A .blocks u.off { background:transparent; box-shadow:inset 0 0 0 1.5px var(--off); }
.A .ports a { color:var(--accent); text-decoration:none; margin-right:8px; }
.A .state.bad { color:var(--bad); font-weight:600; } .A .state.off { color:var(--faint); }
.A svg.spark { width:86px; height:18px; stroke:var(--mute); fill:none; stroke-width:1.2; }
.A .cap { color:var(--faint); font-size:11px; padding:16px 8px 4px; }
.A .chev { color:var(--faint); font-size:10px; }

/* ============ B. Control room: instrument panel. Signature: the inspector that explains ============ */
.B { --bg:#0E1420; --panel:#131B2A; --line:#1F2A3D; --ink:#D7DEEA; --mute:#7C8AA3; --faint:#4F5C75; --accent:#FFB020; --ok:#3DD68C; --warn:#FFB020; --bad:#FF5D5D; --code:#0A0F18; --sel:#1A2740; --btnink:#1A1200;
  height:100%; display:grid; grid-template-columns:56px 430px 1fr; grid-template-rows:40px 1fr; background:var(--bg); color:var(--ink); font-family:"SF Mono", ui-monospace, Menlo, monospace; font-size:12px; }
.B.light { --bg:#F1F3F7; --panel:#FFFFFF; --line:#D9DEE7; --ink:#101828; --mute:#566178; --faint:#97A1B4; --accent:#A85F00; --ok:#128A52; --warn:#A85F00; --bad:#C9302C; --code:#F6F7FA; --sel:#E6ECF7; --btnink:#FFFFFF; }
.B .top { grid-column:1 / -1; display:flex; align-items:center; gap:18px; padding:0 14px 0 76px; border-bottom:1px solid var(--line); color:var(--mute); }
.B .top b { color:var(--ink); font-weight:600; }
.B .top .ok { color:var(--ok); }
.B .top .r { margin-left:auto; display:flex; gap:18px; }
.B .rail { border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:6px; padding-top:10px; }
.B .rail span { width:36px; height:36px; border-radius:8px; display:grid; place-items:center; color:var(--faint); font-size:11px; font-weight:600; }
.B .rail span[aria-current] { background:var(--sel); color:var(--accent); }
.B .list { border-right:1px solid var(--line); overflow:auto; padding:6px 0; }
.B .grp { display:flex; padding:12px 14px 6px; color:var(--faint); font-size:11px; }
.B .grp b { margin-left:auto; font-weight:400; }
.B .it { display:grid; grid-template-columns:12px 1fr auto; gap:0 10px; padding:7px 14px; border-left:2px solid transparent; }
.B .it.sel { background:var(--sel); border-left-color:var(--accent); }
.B .it .n { color:var(--ink); font-weight:600; }
.B .it .n small { color:var(--mute); font-weight:400; }
.B .it .w { grid-column:2 / -1; color:var(--mute); font-family:-apple-system, sans-serif; font-size:12.5px; margin-top:1px; }
.B .it.bad .w { color:var(--bad); } .B .it.warn .w { color:var(--warn); }
.B .d { width:8px; height:8px; border-radius:50%; margin-top:4px; background:var(--ok); }
.B .d.bad { background:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); } .B .d.warn { background:var(--warn); } .B .d.off { background:var(--faint); }
.B .v { color:var(--mute); }
.B .insp { overflow:auto; padding:22px 28px; display:flex; flex-direction:column; gap:16px; font-family:-apple-system, sans-serif; font-size:13px; }
.B .crumb { font-family:"SF Mono", ui-monospace, monospace; font-size:11px; color:var(--mute); }
.B .insp h2 { margin:0; font-size:24px; line-height:1.15; font-weight:650; letter-spacing:-0.01em; max-width:22ch; }
.B .insp p { margin:0; color:var(--mute); max-width:62ch; }
.B pre { margin:0; background:var(--code); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:11.5px/1.6 "SF Mono", ui-monospace, monospace; color:var(--mute); overflow:hidden; }
.B pre b { color:var(--bad); font-weight:400; } .B pre i { color:var(--faint); font-style:normal; }
.B .steps { display:grid; gap:6px; }
.B .steps div { display:flex; gap:10px; align-items:baseline; }
.B .steps i { font:11px "SF Mono", monospace; color:var(--accent); font-style:normal; }
.B .acts { display:flex; gap:8px; }
.B .btn { height:30px; padding:0 14px; border-radius:7px; border:1px solid var(--line); background:var(--panel); font-family:-apple-system, sans-serif; }
.B .btn.pri { background:var(--accent); border-color:var(--accent); color:var(--btnink); font-weight:600; }
.B .lbl { font:11px "SF Mono", monospace; color:var(--faint); }

/* ============ C. Quay: bold and friendly. Signature: what needs you, said out loud, then berths ============ */
.C { --bg:#EEF2F4; --card:#FFFFFF; --ink:#0F1A24; --mute:#50606E; --faint:#93A1AD; --line:#DCE3E8; --blue:#0B5CAB; --rust:#B5442A; --yellow:#E0A800; --green:#2F8F5B; --off:#B8C3CC; --band:#0F1A24; --bandink:#FFFFFF; --bandmute:#A9B8C5;
  height:100%; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); overflow:hidden; }
.C.dark { --bg:#0B141C; --card:#14212C; --ink:#EAF0F4; --mute:#93A4B3; --faint:#5C6E7D; --line:#22323F; --blue:#5AA7F2; --rust:#F07A5C; --yellow:#F2C230; --green:#56C489; --off:#33434F; --band:#14212C; --bandink:#FFFFFF; --bandmute:#93A4B3; }
.C .din { font-family:"DIN Condensed", "DIN Alternate", "Avenir Next Condensed", sans-serif; font-weight:700; letter-spacing:0.01em; }
.C nav { height:52px; display:flex; align-items:center; gap:4px; padding:0 20px 0 84px; }
.C .logo { font-size:22px; margin-right:18px; transform:translateY(2px); }
.C .tab { height:30px; padding:0 12px; border-radius:15px; display:flex; align-items:center; gap:6px; color:var(--mute); }
.C .tab[aria-current] { background:var(--ink); color:var(--bg); font-weight:600; }
.C .tab b { background:var(--rust); color:#fff; border-radius:9px; padding:0 6px; font-size:11px; }
.C .engine { margin-left:auto; display:flex; align-items:center; gap:10px; height:32px; padding:0 12px; border-radius:16px; background:var(--card); border:1px solid var(--line); }
.C .engine i { width:8px; height:8px; border-radius:50%; background:var(--green); }
.C .engine span { color:var(--mute); }
.C .wrap { flex:1; overflow:auto; padding:6px 20px 20px; display:flex; flex-direction:column; gap:14px; }
.C .needs { background:var(--band); color:var(--bandink); border-radius:14px; padding:18px 20px 10px; display:grid; grid-template-columns:230px 1fr; gap:0 24px; }
.C .needs h2 { margin:0; font-size:44px; line-height:.95; }
.C .needs h2 + p { margin:8px 0 0; color:var(--bandmute); }
.C .need { display:grid; grid-template-columns:10px 1fr auto; gap:0 12px; align-items:center; padding:9px 0; border-bottom:1px solid #ffffff1f; }
.C .need:last-child { border-bottom:0; }
.C .need i { width:10px; height:10px; border-radius:2px; background:var(--rust); } .C .need i.warn { background:var(--yellow); }
.C .need b { font-weight:600; } .C .need span { color:var(--bandmute); }
.C .btn { height:30px; padding:0 14px; border-radius:15px; border:1px solid var(--line); background:var(--card); color:var(--ink); white-space:nowrap; font-weight:500; }
.C .needs .btn { background:#fff; color:#0F1A24; border-color:#fff; }
.C .needs .btn.q { background:transparent; color:#fff; border-color:#ffffff55; }
.C .row { display:flex; align-items:baseline; gap:12px; }
.C .row h3 { margin:0; font-size:20px; }
.C .row span { color:var(--mute); }
.C .row .btn { margin-left:auto; background:var(--blue); border-color:var(--blue); color:#fff; align-self:center; }
.C.dark .row .btn { color:#0B141C; }
.C .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
.C .berth { background:var(--card); border-radius:12px; padding:14px 14px 12px 22px; position:relative; overflow:hidden; display:flex; flex-direction:column; gap:10px; min-height:168px; border:1px solid var(--line); }
.C .berth::before { content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--green); }
.C .berth.bad::before { background:var(--rust); } .C .berth.off::before { background:var(--off); }
.C .berth h4 { margin:0; font-size:28px; line-height:1; }
.C .berth .path { color:var(--mute); font-size:12px; margin-top:-6px; }
.C .stack { display:flex; gap:4px; align-items:flex-end; }
.C .stack u { width:26px; height:18px; border-radius:3px; background:var(--green); text-decoration:none; background-image:repeating-linear-gradient(90deg, #0000 0 4px, #0000001f 4px 5px); }
.C .stack u.bad { background-color:var(--rust); } .C .stack u.warn { background-color:var(--yellow); } .C .stack u.off { background:none; box-shadow:inset 0 0 0 1.5px var(--off); }
.C .stack span { margin-left:8px; color:var(--mute); font-size:12px; }
.C .foot { margin-top:auto; display:flex; align-items:center; gap:6px; }
.C .port { height:24px; padding:0 9px; border-radius:12px; background:var(--bg); color:var(--blue); font-weight:600; display:flex; align-items:center; font-size:12px; }
.C .port s { color:var(--faint); font-weight:400; margin-left:5px; text-decoration:none; }
.C .foot .btn { margin-left:auto; }
.C .loose { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
.C .chipc { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; display:flex; align-items:center; gap:10px; }
.C .chipc i { width:10px; height:10px; border-radius:2px; background:var(--green); } .C .chipc i.bad { background:var(--rust); } .C .chipc i.warn { background:var(--yellow); }
.C .chipc span { color:var(--mute); margin-left:auto; font-size:12px; }
</style>
</head>
<body>
<div id="bar"><button data-d="a">A Manifest</button><button data-d="b">B Control room</button><button data-d="c">C Quay</button><button id="th">Light / dark</button></div>
<div id="root"></div>
<script>
const spark = (pts) => `<svg class="spark" viewBox="0 0 86 18"><polyline points="${pts.map((y, i) => `${i * (86 / (pts.length - 1))},${18 - y}`).join(" ")}"/></svg>`;
const blocks = (s) => s.split("").map(c => `<u class="${{ o: "", w: "warn", b: "bad", x: "off" }[c]}"></u>`).join("");

const A = (t) => `
<div class="A ${t}">
  <aside>
    <div class="eng"><span style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span><div><b>Colima · default</b><small>Running</small></div></div>
    <div class="nav" aria-current="page">Projects <b>3</b></div>
    <div class="nav">Containers <b>11</b></div><div class="nav">Images</div><div class="nav">Volumes</div><div class="nav">Networks</div><div class="nav">Kubernetes</div>
    <div style="flex:1"></div>
    <div class="nav">Doctor <b class="alert">2</b></div><div class="nav">Settings</div>
  </aside>
  <main>
    <header><h1>Projects</h1><span class="sub">3 projects · 3 things need attention</span>
      <div class="meters num">
        <div class="meter" style="--v:12%">CPU <i></i> 12%</div>
        <div class="meter hot" style="--v:64%">Memory <i></i> 5.1 of 8 GB</div>
        <div class="meter" style="--v:68%">Disk <i></i> 41 of 60 GB</div>
      </div>
      <button class="btn pri">Add project</button></header>
    <div class="tbl">
      <div class="tr th"><span></span><span>Project</span><span>Services</span><span>Folder</span><span>Ports</span><span>CPU, 10 min</span><span>State</span><span></span></div>
      <div class="tr"><span class="chev">▼</span><span class="nm">shop</span><span class="blocks">${blocks("booowbx")}</span><span class="sub">~/code/shop</span><span class="ports num"><a>8080</a><a>5432</a></span>${spark([3, 4, 3, 6, 9, 5, 4, 7, 12, 8, 5, 4])}<span class="state bad">5 of 7 running</span><button class="btn">Stop</button></div>
      <div class="tr kid"><span></span><span class="nm">api</span><span class="blocks">${blocks("b")}</span><span class="sub">acme/billing-api:3.1</span><span class="ports num"><a>8080</a></span>${spark([2, 2, 3, 2, 2, 2, 3, 2, 2, 2, 2, 2])}<span class="state bad">Unhealthy</span><button class="btn">Stop</button></div>
      <div class="tr why"><span></span><span><em>Its health check is failing.</em> The last 5 checks could not connect to port 8080 inside the container.</span><button class="btn pri">See why</button></div>
      <div class="tr kid"><span></span><span class="nm">worker</span><span class="blocks">${blocks("w")}</span><span class="sub">acme/worker:3.1</span><span></span>${spark([1, 6, 1, 7, 1, 6, 1, 8, 1, 6, 1, 7])}<span class="state" style="color:var(--warn);font-weight:600">Restarting</span><button class="btn">Stop</button></div>
      <div class="tr kid"><span></span><span class="nm">report-job</span><span class="blocks">${blocks("b")}</span><span class="sub">acme/report:3.1</span><span></span><span></span><span class="state bad">Out of memory</span><button class="btn">Start</button></div>
      <div class="tr kid"><span></span><span class="nm">web, db, queue</span><span class="blocks">${blocks("ooo")}</span><span class="sub">3 services, all healthy</span><span class="ports num"><a>5432</a></span>${spark([2, 2, 2, 3, 2, 2, 2, 2, 3, 2, 2, 2])}<span class="state">Running</span><span></span></div>
      <div class="tr"><span class="chev">▶</span><span class="nm">billing</span><span class="blocks">${blocks("ooo")}</span><span class="sub">~/code/billing</span><span class="ports num"><a>8081</a><a>5433</a></span>${spark([4, 5, 4, 4, 6, 5, 4, 5, 4, 4, 5, 4])}<span class="state">3 of 3 running</span><button class="btn">Stop</button></div>
      <div class="tr"><span class="chev">▶</span><span class="nm">search</span><span class="blocks">${blocks("xxxx")}</span><span class="sub">~/work/search-service</span><span></span><span></span><span class="state off">Not started</span><button class="btn">Start</button></div>
      <div class="cap">Not in a project</div>
      <div class="tr"><span></span><span class="nm">kafka-ui</span><span class="blocks">${blocks("b")}</span><span class="sub">provectuslabs/kafka-ui</span><span class="ports num"><a>8082</a></span>${spark([1, 1, 1, 1, 2, 1, 1, 1, 1, 1, 1, 1])}<span class="state bad">Can't reach Kafka</span><button class="btn pri">Fix…</button></div>
      <div class="tr"><span></span><span class="nm">kafka</span><span class="blocks">${blocks("w")}</span><span class="sub">apache/kafka:3.8</span><span></span>${spark([3, 3, 4, 3, 3, 4, 3, 3, 3, 4, 3, 3])}<span class="state">Running</span><button class="btn">Stop</button></div>
    </div>
  </main>
</div>`;

const B = (t) => `
<div class="B ${t}">
  <div class="top"><b>colima/default</b><span class="ok">running</span>
    <div class="r num"><span>cpu <b>12%</b></span><span>mem <b>5.1</b>/8G</span><span>disk <b>41</b>/60G</span><span>⌘K</span></div></div>
  <div class="rail"><span aria-current="page">Pr</span><span>Co</span><span>Im</span><span>Vo</span><span>Ne</span><span>K8</span><span style="margin-top:auto;color:var(--bad)">Dr</span><span style="margin-bottom:10px">Se</span></div>
  <div class="list">
    <div class="grp">Needs attention<b>3</b></div>
    <div class="it bad sel"><i class="d bad"></i><span class="n">api <small>shop</small></span><span class="v num">:8080</span><span class="w">Its health check is failing</span></div>
    <div class="it warn"><i class="d warn"></i><span class="n">worker <small>shop</small></span><span class="v"></span><span class="w">Keeps restarting, 6 times in 10 minutes</span></div>
    <div class="it bad"><i class="d bad"></i><span class="n">kafka-ui</span><span class="v num">:8082</span><span class="w">Can't reach Kafka</span></div>
    <div class="grp">Projects<b>3</b></div>
    <div class="it"><i class="d bad"></i><span class="n">shop <small>~/code/shop</small></span><span class="v num">5/7</span></div>
    <div class="it"><i class="d"></i><span class="n">billing <small>~/code/billing</small></span><span class="v num">3/3</span></div>
    <div class="it"><i class="d off"></i><span class="n">search <small>~/work/search-service</small></span><span class="v">off</span></div>
    <div class="grp">Running fine<b>6</b></div>
    <div class="it"><i class="d"></i><span class="n">web <small>shop</small></span><span class="v num">0% 14M</span></div>
    <div class="it"><i class="d"></i><span class="n">db <small>shop</small></span><span class="v num">0% 96M</span></div>
    <div class="it"><i class="d"></i><span class="n">db <small>billing</small></span><span class="v num">:5433</span></div>
    <div class="it"><i class="d"></i><span class="n">scratch-postgres</span><span class="v num">:5434</span></div>
  </div>
  <div class="insp">
    <div class="crumb">shop / api · acme/billing-api:3.1 · up 3h</div>
    <h2>Its health check is failing</h2>
    <p>The container is running, but 5 checks in a row could not connect to port 8080 inside it. Either the app has not started listening yet, or it listens on another port.</p>
    <div><div class="lbl" style="margin-bottom:6px">What the last check said</div>
<pre><i>14:02:11</i> curl -f http://localhost:8080/health

    <div><div class="lbl" style="margin-bottom:6px">What to check</div>

const P = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
function render() {
  const p = P(), d = p.dir || "a", dark = p.theme === "dark";
  document.body.classList.toggle("bare", p.bare === "1");
  document.getElementById("root").innerHTML = d === "b" ? B(dark ? "" : "light") : d === "c" ? C(dark ? "dark" : "") : A(dark ? "dark" : "");
}
const set = (o) => { location.hash = new URLSearchParams({ ...P(), ...o }).toString(); };
document.querySelectorAll("#bar [data-d]").forEach(b => b.onclick = () => set({ dir: b.dataset.d }));
document.getElementById("th").onclick = () => set({ theme: P().theme === "dark" ? "light" : "dark" });
addEventListener("hashchange", render); render();
</script>
