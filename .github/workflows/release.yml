name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: Container UI_aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: Container UI_x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## Container UI ${{ github.ref_name }}

            ### Features
            - Project management with auto-detection (devcontainer, compose, Dockerfile)
            - Environment lifecycle (create, start, stop, restart, delete)
            - Terminal with xterm.js (reconnection, scrollback, Ctrl+C/L/D)
            - Logs (filter, search, pause, virtualization >1000 lines)
            - Port forwarding (collision handling, inline retry, copy to clipboard)
            - Auto-injected credentials (SSH agent, Git user/email, GH_TOKEN)

          args: --target ${{ matrix.target }}

  universal-binary:
    needs: build-macos
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create universal binary
        run: |
          lipo -create \
            artifacts/Container UI_aarch64/Container UI.app/Contents/MacOS/container-ui \
            artifacts/Container UI_x86_64/Container UI.app/Contents/MacOS/container-ui \
            -output universal-container-ui
          # Copy to aarch64 app bundle
          cp universal-container-ui artifacts/Container UI_aarch64/Container UI.app/Contents/MacOS/container-ui
          # Re-sign
          codesign --force --deep --sign - artifacts/Container UI_aarch64/Container UI.app
      - name: Upload universal release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Container UI_aarch64/Container UI_*.dmg
            artifacts/Container UI_x86_64/Container UI_*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}