name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        npm run build
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        target: 'x86_64-unknown-linux-gnu'
        components: ["rustfmt", "clippy"]
    
    - name: Build with Cargo
      run: |
        cargo build --release --target x86_64-unknown-linux-gnu
    
    - name: Build with Tauri
      run: |
        npm run tauri build
    
    - name: Get version from tag
      id: vars
      run: |
        echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref }}
        name: "Container UI v${{ steps.vars.outputs.version }}"
        body: |
          Release notes for Container UI v${{ steps.vars.outputs.version }}
          - Multi-platform release (macOS, Windows, Linux)
          - Multi-arch support (Intel + ARM)
          - Improved UI/UX with 80/20 design language
        files: |
          ${{ matrix.artifact_name }}.*
        draft: false
        prerelease: false
        generate_release_notes: true