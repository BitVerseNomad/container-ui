# Push a tag like v0.2.0 and this builds the Apple Silicon .dmg and attaches it to a GitHub Release.
# The app is not signed or notarized; README "Install" covers the one macOS step that needs.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon runner, so the build is aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        run: |
          npm test
          cd src-tauri && cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Colima UI ${{ github.ref_name }}"
          releaseBody: "Download the .dmg below, or run the one-line install from the README."
          releaseDraft: false
          prerelease: false
