name: Windows check

# Does the app compile and pass its Rust tests on Windows (x64, Intel and AMD)? Runs on the windows-port branch and by hand.
on:
  workflow_dispatch:
  push:
    branches: [windows-port]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Compile
        working-directory: src-tauri
        run: cargo check --all-targets 2>&1 | Tee-Object -FilePath ..\cargo-check.log; if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test 2>&1 | Tee-Object -FilePath ..\cargo-test.log; if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            cargo-check.log
            cargo-test.log

  installer:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Unsigned: Windows shows a SmartScreen warning on first run ("More info", then "Run anyway").
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
