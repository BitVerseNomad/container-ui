name: Windows check

# Does the app compile and pass its Rust tests on Windows (x64, Intel and AMD)? Runs on the windows-port branch and by hand.
on:
  workflow_dispatch:
  push:
    branches: [windows-port]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Compile
        working-directory: src-tauri
        run: cargo check --all-targets 2>&1 | Tee-Object -FilePath ..\cargo-check.log
        continue-on-error: true
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test 2>&1 | Tee-Object -FilePath ..\cargo-test.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            cargo-check.log
            cargo-test.log
