name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            node_version: '22.x'
            cargo_target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'container-ui-linux'
          - os: windows-latest
            node_version: '22.x'
            cargo_target: 'x86_64-pc-windows-msvc'
            artifact_name: 'container-ui-windows'
          - os: macos-latest
            node_version: '22.x'
            cargo_target: 'x86_64-apple-darwin'
            artifact_name: 'container-ui-macos'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node_version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        npm run build
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        target: ${{ matrix.cargo_target }}
        components: ["rustfmt", "clippy"]
    
    - name: Build with Cargo
      run: |
        cargo build --release --target ${{ matrix.cargo_target }}
    
    - name: Copy frontend build
      run: |
        cp -r dist ../${{ matrix.artifact_name }}
    
    - name: Package artifact
      run: |
        cd ${{ matrix.artifact_name }}
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          # Create dmg for macOS
          npm run tauri build
          hdiutil create -volname "Container UI" -srcfolder . -ov -format UDZO ../${{ matrix.artifact_name }}.dmg
        elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          # Create msi for Windows
          npm run tauri build
          # The .msi will be in target/release/bundle/
        else
          # Create tar.gz for Linux
          tar -czf ../${{ matrix.artifact_name }}.tar.gz *
        fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.*