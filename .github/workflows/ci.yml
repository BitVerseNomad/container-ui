# Every pull request: unit tests, Rust tests, and every browser check in Chromium and WebKit (the app's engine).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm test
      - run: cd src-tauri && cargo test
      - run: npx tsc --noEmit
      - run: npm run check
